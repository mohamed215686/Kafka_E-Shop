services: 
 
  # ========================================== 
  # KAFKA BROKER 1 + KRAFT CONTROLLER 
  # ========================================== 
 
  kafka1: 
    image: confluentinc/cp-kafka:7.7.1 
    container_name: kafka1 
    hostname: kafka1 
 
    ports: 
      - "9092:9092" 
 
    environment: 
      KAFKA_NODE_ID: 1 
      KAFKA_PROCESS_ROLES: broker,controller 
 
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093 
 
      KAFKA_LISTENERS: PLAINTEXT://kafka1:29092,CONTROLLER://kafka1:29093,EXTERNAL://0.0.0.0:9092 
 
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,EXTERNAL://localhost:9092 
 
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT 
 
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT 
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER 
 
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk 
 
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3 
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3 
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 
 
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3 
      KAFKA_MIN_INSYNC_REPLICAS: 2 
 
      KAFKA_NUM_PARTITIONS: 3 
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" 
 
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 
 
    volumes: 
      - kafka1-data:/var/lib/kafka/data 
 
    networks: 
      - E-Shop-network 
 
  # ========================================== 
  # KAFKA BROKER 2 + KRAFT CONTROLLER 
  # ========================================== 
 
  kafka2: 
    image: confluentinc/cp-kafka:7.7.1 
    container_name: kafka2 
    hostname: kafka2 
 
    ports: 
      - "9093:9093" 
 
    environment: 
      KAFKA_NODE_ID: 2 
      KAFKA_PROCESS_ROLES: broker,controller 
 
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093 
 
      KAFKA_LISTENERS: PLAINTEXT://kafka2:29092,CONTROLLER://kafka2:29093,EXTERNAL://0.0.0.0:9093 
 
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29092,EXTERNAL://localhost:9093 
 
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT 
 
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT 
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER 
 
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk 
 
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3 
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3 
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 
 
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3 
      KAFKA_MIN_INSYNC_REPLICAS: 2 
 
      KAFKA_NUM_PARTITIONS: 3 
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" 
 
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 
 
    volumes: 
      - kafka2-data:/var/lib/kafka/data 
 
    networks: 
      - E-Shop-network 
 
  # ========================================== 
  # KAFKA BROKER 3 + KRAFT CONTROLLER 
  # ========================================== 
 
  kafka3: 
    image: confluentinc/cp-kafka:7.7.1 
    container_name: kafka3 
    hostname: kafka3 
 
    ports: 
      - "9094:9094" 
 
    environment: 
      KAFKA_NODE_ID: 3 
      KAFKA_PROCESS_ROLES: broker,controller 
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093 
 
      KAFKA_LISTENERS: PLAINTEXT://kafka3:29092,CONTROLLER://kafka3:29093,EXTERNAL://0.0.0.0:9094 
 
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29092,EXTERNAL://localhost:9094 
 
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT 
 
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT 
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER 
 
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk 
 
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3 
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3 
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2 
 
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3 
      KAFKA_MIN_INSYNC_REPLICAS: 2 
 
      KAFKA_NUM_PARTITIONS: 3 
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" 
 
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 
 
    volumes: 
      - kafka3-data:/var/lib/kafka/data 
 
    networks: 
      - E-Shop-network 
 
  # ========================================== 
  # KAFKA UI 
  # ========================================== 
 
  kafka-ui: 
    image: provectuslabs/kafka-ui:v0.7.2 
    container_name: kafka-ui 
 
    ports: 
      - "8080:8080" 
 
    environment: 
      DYNAMIC_CONFIG_ENABLED: "false" 
 
      KAFKA_CLUSTERS_0_NAME: E-Shop-Kafka 
 
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092 
 
    depends_on: 
      - kafka1 
      - kafka2 
      - kafka3 
    networks: 
      - E-Shop-network 
 
# ========================================== 
# PERSISTENT VOLUMES 
# ========================================== 
 
volumes: 
  kafka1-data: 
  kafka2-data: 
  kafka3-data: 
 
# ========================================== 
# NETWORK 
# ========================================== 
 
networks: 
  E-Shop-network: 
    driver: bridge 